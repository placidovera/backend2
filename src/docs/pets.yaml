paths:

  /api/users/register:
    post:
      summary: Registra un nuevo usuario.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/registerUser'

      responses:
        "201":
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        "400":
          description: Datos inválidos o email ya existente.

        "500":
          description: Error del servidor.


  /api/auth/login:
    post:
      summary: Inicia sesión de un usuario.
      tags:
        - Auth

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/loginUser'

      responses:
        "200":
          description: Login exitoso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

                  user:
                    $ref: '#/components/schemas/User'

        "401":
          description: Usuario no encontrado o contraseña incorrecta.

        "500":
          description: Error del servidor.


  /session/current:
    get:
      summary: Obtiene la sesión actual autenticada.
      tags:
        - Session

      responses:
        "200":
          description: Sesión obtenida correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_name:
                    type: string

                  email:
                    type: string

                  role:
                    type: string

        "401":
          description: Unauthorized.

        "500":
          description: Error del servidor.


  /api/auth/logout:
    post:
      summary: Cierra la sesión del usuario.
      tags:
        - Auth

      responses:
        "200":
          description: Logout exitoso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

        "500":
          description: Error del servidor.


  /api/pets:
    get:
      summary: Obtiene todas las mascotas.
      tags:
        - Pets

      responses:
        "200":
          description: Lista de mascotas obtenida correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

        "500":
          description: Error del servidor.


    post:
      summary: Crea una nueva mascota.
      tags:
        - Pets

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/createPet'

      responses:
        "201":
          description: Mascota creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        "400":
          description: Error de validación.

        "500":
          description: Error del servidor.


  /api/pets/{pid}:
    get:
      summary: Obtiene una mascota por ID.
      tags:
        - Pets

      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota.
          schema:
            type: string

      responses:
        "200":
          description: Mascota encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

        "404":
          description: Mascota no encontrada.

        "500":
          description: Error del servidor.


    put:
      summary: Actualiza una mascota por ID.
      tags:
        - Pets

      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota.
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/updatePet'

      responses:
        "200":
          description: Mascota actualizada correctamente.

        "401":
          description: Unauthorized.

        "403":
          description: No autorizado.

        "500":
          description: Error del servidor.


    delete:
      summary: Elimina una mascota por ID.
      tags:
        - Pets

      parameters:
        - name: pid
          in: path
          required: true
          description: ID de la mascota.
          schema:
            type: string

      responses:
        "200":
          description: Mascota eliminada correctamente.

        "404":
          description: Mascota no encontrada.

        "500":
          description: Error del servidor.



components:

  schemas:

    User:
      type: object

      properties:
        _id:
          type: string
          description: ID generado automáticamente por MongoDB.

        first_name:
          type: string
          description: Nombre del usuario.

        email:
          type: string
          description: Email del usuario.

        password:
          type: string
          description: Contraseña hasheada con bcrypt.

        role:
          type: string
          description: Rol del usuario.

      example:
        _id: 69fbdaa4042e0393267e33e8
        first_name: Martin
        email: admin@test.com
        password: $2b$10$eEYTosze9A20sdMcV10QA.ruT8nX/dcXfecRh9muPpp9NkVAoJsH6
        role: user



    Pet:
      type: object

      properties:
        _id:
          type: string
          description: ID generado automáticamente por MongoDB.

        name:
          type: string
          description: Nombre de la mascota.

        species:
          type: string
          description: Tipo de mascota.

        breed:
          type: string
          description: Raza.

        age:
          type: number
          description: Edad.

        size:
          type: string
          description: Tamaño de la mascota.

        description:
          type: string
          description: Descripción de la mascota.

        status:
          type: string
          description: Estado de adopción.

        images:
          type: array
          items:
            type: string

        vaccinated:
          type: boolean
          description: Estado de vacunación.

        stock:
          type: number
          description: Cantidad disponible.

      example:
        _id: 69fbddf7e065d02a3b317f9a
        name: Rocky
        species: Perro
        breed: Labrador
        age: 3
        size: Grande
        description: Perro muy juguetón y amigable
        status: disponible
        images:
          - https://imagen1.jpg
          - https://imagen2.jpg
        vaccinated: true
        stock: 1



  requestBodies:

    registerUser:
      type: object

      properties:
        first_name:
          type: string

        email:
          type: string

        password:
          type: string

      example:
        first_name: Martin
        email: admin@test.com
        password: "123456"



    loginUser:
      type: object

      properties:
        email:
          type: string

        password:
          type: string

      example:
        email: admin@test.com
        password: "123456"



    createPet:
      type: object

      properties:
        name:
          type: string

        species:
          type: string

        breed:
          type: string

        age:
          type: number

        size:
          type: string

        description:
          type: string

        status:
          type: string

        images:
          type: array
          items:
            type: string

        vaccinated:
          type: boolean

        stock:
          type: number

      example:
        name: Rocky
        species: Perro
        breed: Labrador
        age: 3
        size: Grande
        description: Perro muy juguetón y amigable
        status: disponible
        images:
          - https://imagen1.jpg
          - https://imagen2.jpg
        vaccinated: true
        stock: 1



    updatePet:
      type: object

      properties:
        stock:
          type: number

        status:
          type: string

      example:
        stock: 5
        status: adoptado